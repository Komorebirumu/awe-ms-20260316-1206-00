    <script>
        document.getElementById('summarizeBtn').addEventListener('click', async () => {
            const abstractInput = document.getElementById('abstractInput').value;
            const summaryResultDiv = document.getElementById('summaryResult');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const summarizeBtn = document.getElementById('summarizeBtn');

            if (!abstractInput.trim()) {
                alert('Please paste an abstract to simplify.');
                return;
            }

            summaryResultDiv.style.display = 'none';
            loadingIndicator.style.display = 'block';
            summarizeBtn.disabled = true;

            try {
                // In a real application, this would involve an API call to an AI model.
                // For this self-contained HTML, we'll simulate an AI response.
                // We will use a placeholder for the AI model.
                const simulatedSummary = await simulateAISummarization(abstractInput);

                summaryResultDiv.innerHTML = simulatedSummary;
                summaryResultDiv.style.display = 'block';
            } catch (error) {
                console.error('Error during summarization:', error);
                summaryResultDiv.innerHTML = 'An error occurred while trying to simplify the abstract. Please try again later.';
                summaryResultDiv.style.display = 'block';
            } finally {
                loadingIndicator.style.display = 'none';
                summarizeBtn.disabled = false;
            }
        });

        // --- Simulated AI Summarization Function ---
        // This function mimics the behavior of an AI model by providing a structured summary.
        // In a live application, this would be replaced by an API call to an actual AI service.
        async function simulateAISummarization(abstractText) {
            // Basic text analysis to identify potential keywords and structure
            const sentences = abstractText.split('. ');
            let keyFindings = [];
            let methodology = [];
            let implications = [];

            // Simple keyword-based extraction (highly rudimentary for simulation)
            const keywords = {
                findings: ['found', 'revealed', 'demonstrated', 'showed', 'identified', 'results'],
                methods: ['method', 'approach', 'procedure', 'technique', 'used', 'developed'],
                implications: ['implication', 'suggests', 'potential', 'future', 'impact', 'application']
            };

            sentences.forEach((sentence, index) => {
                const lowerSentence = sentence.toLowerCase();
                if (keywords.findings.some(kw => lowerSentence.includes(kw))) {
                    keyFindings.push(`- ${sentence.trim()}.`);
                } else if (keywords.methods.some(kw => lowerSentence.includes(kw))) {
                    methodology.push(`- ${sentence.trim()}.`);
                } else if (keywords.implications.some(kw => lowerSentence.includes(kw))) {
                    implications.push(`- ${sentence.trim()}.`);
                }
            });

            // Fallback if no keywords are found (just take the first few sentences)
            if (keyFindings.length === 0 && methodology.length === 0 && implications.length === 0) {
                keyFindings = sentences.slice(0, Math.min(3, sentences.length)).map(s => s.trim() + '.');
                methodology = sentences.slice(3, Math.min(5, sentences.length)).map(s => s.trim() + '.');
                implications = sentences.slice(5, Math.min(7, sentences.length)).map(s => s.trim() + '.');
            }

            // Limit the number of points for clarity
            keyFindings = keyFindings.slice(0, 3);
            methodology = methodology.slice(0, 2);
            implications = implications.slice(0, 2);

            const summary = `
                <strong>Simplified Summary:</strong>
                <br><br>
                <strong>What they found:</strong>
                ${keyFindings.length > 0 ? keyFindings.join('<br>') : 'Key findings could not be specifically identified from the abstract based on common indicators.'}
                <br><br>
                <strong>How they did it (Methodology):</strong>
                ${methodology.length > 0 ? methodology.join('<br>') : 'The core methods or approach were not clearly delineated in this abstract for simplification.'}
                <br><br>
                <strong>Why it matters (Implications):</strong>
                ${implications.length > 0 ? implications.join('<br>') : 'The broader impact or future directions were not explicitly stated in a way that could be simplified for this abstract.'}
                <br><br>
                <em>Note: This is an AI-generated simplification. For full details, please refer to the original paper.</em>
            `;

            // Simulate network delay
            await new Promise(resolve => setTimeout(resolve, 1500));

            return summary;
        }
